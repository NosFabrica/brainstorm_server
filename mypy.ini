[mypy]
plugins = pydantic.mypy

# nostr_sdk ships no py.typed marker; tqdm has no bundled stubs. Both are
# third-party gaps, not ours — treat their surfaces as Any rather than
# scattering per-import ignores through the codebase.
[mypy-nostr_sdk.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True
