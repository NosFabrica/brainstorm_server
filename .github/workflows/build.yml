name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Dockerfile is the single source for both versions, so CI can never
      # lint and test against a toolchain the image doesn't use.
      - name: Read toolchain versions from the Dockerfile
        id: toolchain
        run: |
          poetry_version=$(sed -n 's/^ENV POETRY_VERSION=//p' Dockerfile | head -1)
          python_version=$(sed -n 's/^ARG PYTHON_VERSION=\([0-9.]*\).*/\1/p' Dockerfile | head -1)
          test -n "$poetry_version" && test -n "$python_version"
          echo "poetry=$poetry_version" >> "$GITHUB_OUTPUT"
          echo "python=$python_version" >> "$GITHUB_OUTPUT"

      # Poetry first: setup-python's `cache: poetry` resolves the cache dir by
      # shelling out to poetry, so it has to already be on PATH.
      - name: Install Poetry
        run: pipx install "poetry==${{ steps.toolchain.outputs.poetry }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # Integration tests need real services, so they never gate.
      - name: Lint and test
        env:
          PYTEST_ADDOPTS: "-m 'not integration'"
        run: poetry run poe check_all

  build:
    name: Build and push image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3018,DL3059
          failure-threshold: warning

      - name: Compute lowercase image name
        id: img
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION_ARG=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
